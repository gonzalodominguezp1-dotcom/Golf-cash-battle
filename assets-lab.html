<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Laboratorio de assets</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #10151a; color: #e8eef2; font: 14px/1.3 system-ui, sans-serif; overscroll-behavior: none; }
      #app { display: flex; flex-direction: column; height: 100%; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 8px 10px; background: #1a222a; align-items: center; }
      .bar label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
      .bar select, .bar button, .bar input[type=number] { font: inherit; color: inherit; background: #26323d; border: 1px solid #3a4a58; border-radius: 6px; padding: 6px 8px; min-height: 36px; }
      .bar input[type=range] { width: 130px; min-height: 36px; }
      .bar input[type=number] { width: 84px; }
      #stage { position: relative; flex: 1; min-height: 0; touch-action: none; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .tag { position: absolute; pointer-events: none; padding: 4px 8px; border-radius: 6px; background: rgba(0, 0, 0, 0.55); font-size: 12px; white-space: nowrap; }
      .msg { position: absolute; pointer-events: none; text-align: center; color: #cfd9e0; font-size: 13px; padding: 0 12px; }
      .val { min-width: 3.2em; display: inline-block; text-align: right; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="bar">
        <label>Asset <select id="asset"></select></label>
        <label>Tema <select id="theme"></select></label>
        <label>Calidad <select id="quality"></select></label>
        <label>Semilla <input id="seed" type="number" value="1" min="0" step="1" /></label>
        <button id="reseed" type="button">Otra</button>
      </div>
      <div id="stage"></div>
      <div class="bar">
        <label>Viento <input id="strength" type="range" min="0" max="2" step="0.05" value="1" /><span class="val" id="strengthV">1.00</span></label>
        <label>Ángulo <input id="angle" type="range" min="0" max="360" step="5" value="0" /><span class="val" id="angleV">0°</span></label>
        <button id="gust" type="button">Ráfaga</button>
        <span id="windState"></span>
      </div>
    </div>
    <script type="module" src="/src/lab/assetsLab.js"></script>
  </body>
</html>
