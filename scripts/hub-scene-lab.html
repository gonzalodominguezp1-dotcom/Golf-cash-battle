<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio de la escena del hub</title>
  <style>
    html, body { margin: 0; height: 100%; background: #123; color: #fff; font: 12px/1.4 system-ui, sans-serif; }
    #scene { position: fixed; inset: 0; }
    #info { position: fixed; left: 8px; top: 8px; padding: 4px 8px; background: rgba(0,0,0,.55); border-radius: 6px; white-space: pre; }
  </style>
</head>
<body>
  <!-- Solo dev (no entra en el build). Parámetros: ?q=low|medium|high&layer=sky|forest|green&nowebgl=1&seed=N
       El botón «Medir FPS 10 s» se oculta con ?capture=1 y siempre que haya ?layer= (capturas).
       Expone window.lab = { scene, error } -->
  <div id="scene"></div>
  <div id="info">cargando…</div>
  <button id="measure" style="position:fixed;right:8px;top:8px;padding:6px 10px">Medir FPS 10 s</button>
  <script type="module" src="./hub-scene-lab.js"></script>
</body>
</html>
