name: Pruebas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  juego:
    name: Pruebas y build del juego
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # física determinista, réplica del servidor, antibots, economía y progreso
      - run: npm test
      - run: npm run build

  funciones:
    name: Funciones de Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # comprueba tipos e imports de las Edge Functions antes de desplegarlas
      - run: deno check supabase/functions/*/index.ts
